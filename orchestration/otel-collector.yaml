receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "rabbitmq"
          static_configs:
            - targets: ["rabbitmq:15692"]

exporters:
  otlp:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlp]
