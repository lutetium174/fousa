global:
  scrape_interval: 15s

remote_write:
  - url: http://mimir:9009/api/v1/push

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rabbitmq"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["rabbitmq:15692"]
