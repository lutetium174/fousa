name: events-stack

networks:
  events-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24

services:
  traefik:
    image: traefik
    container_name: events-traefik
    hostname: traefik
    command:
      - --log.level=DEBUG
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.traefik.address=:8080
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      kafka-ui:
        condition: service_started
      pinot-controller:
        condition: service_started
    networks:
      - events-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    user: "0"
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # Enable KRaft mode (no ZooKeeper)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /opt/kafka/data/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka_data:/opt/kafka/data/kraft-combined-logs
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - events-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka-ui.rule=Host(`kafka-ui.local`)"
      - "traefik.http.routers.kafka-ui.entrypoints=web"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"
    networks:
      - events-network

  zookeeper:
    image: zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    volumes:
      - zookeeper_data:/data
      - zookeeper_log:/datalog
    healthcheck:
      test: ["CMD", "echo", "stat | nc 127.0.0.1 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - events-network

  pinot-controller:
    image: apachepinot/pinot:latest
    container_name: pinot-controller
    hostname: pinot-controller
    ports:
      - "9000:9000"
    depends_on:
      - zookeeper
    environment:
      PINOT_ZK_ADDRESS: zookeeper:2181
      PINOT_CONTROLLER_HOST: 172.19.0.6
      JAVA_OPTS: "-Xms256m -Xmx1g --enable-native-access=ALL-UNNAMED"
    volumes:
      - ./pinot/data:/data
      - ./pinot/config:/config
    command: "StartController -zkAddress zookeeper:2181 -controllerPort 9000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pinot-controller.rule=Host(`pinot.local`)"
      - "traefik.http.routers.pinot-controller.entrypoints=web"
      - "traefik.http.services.pinot-controller.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      events-network:
        ipv4_address: 172.19.0.6

  pinot-broker:
    image: apachepinot/pinot:latest
    container_name: pinot-broker
    hostname: pinot-broker
    command: "StartBroker -zkAddress zookeeper:2181"
    ports:
      - "8099:8099"
    depends_on:
      - pinot-controller
    environment:
      PINOT_ZK_ADDRESS: zookeeper:2181
      PINOT_CONTROLLER_HOST: 172.19.0.6
      PINOT_CONTROLLER_PORT: 9000
      PINOT_BROKER_HOST: pinot-broker
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50 -XX:+UseParallelGC -XX:TieredStopAtLevel=1 --enable-native-access=ALL-UNNAMED"
    networks:
      events-network:
        ipv4_address: 172.19.0.7

  pinot-server:
    image: apachepinot/pinot:latest
    container_name: pinot-server
    hostname: pinot-server
    command: "StartServer -zkAddress zookeeper:2181"
    ports:
      - "8097:8097"
      - "8098:8098"
    depends_on:
      - pinot-broker
    environment:
      PINOT_ZK_ADDRESS: zookeeper:2181
      PINOT_CONTROLLER_HOST: 172.19.0.6
      PINOT_CONTROLLER_PORT: 9000
      PINOT_SERVER_HOST: pinot-server
    networks:
      events-network:
        ipv4_address: 172.19.0.8

  pinot-init:
    image: apachepinot/pinot:latest
    container_name: pinot-init
    hostname: pinot-init
    depends_on:
      pinot-server:
        condition: service_started
      pinot-controller:
        condition: service_healthy
      pinot-broker:
        condition: service_healthy
    volumes:
      - ./pinot/config:/config
    entrypoint: ["sh", "-c"]
    command: ["sleep 60 && /opt/pinot/bin/pinot-admin.sh AddSchema -schemaFile /config/messages-schema.json -controllerHost 172.19.0.6 -controllerPort 9000 -exec || true && /opt/pinot/bin/pinot-admin.sh AddTable -tableConfigFile /config/messages-table.json -schemaFile /config/messages-schema.json -controllerHost 172.19.0.6 -controllerPort 9000 -exec || true && tail -f /dev/null"]
    environment:
      PINOT_CONTROLLER_HOST: 172.19.0.6
      PINOT_CONTROLLER_PORT: 9000
    networks:
      - events-network

volumes:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  pinot_data:
