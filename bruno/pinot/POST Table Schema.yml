info:
  name: POST Table Schema
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:9000/schemas
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "schemaName": "messages",
        "dimensionFieldSpecs": [
          {
            "name": "Id",
            "dataType": "STRING",
            "singleValueField": true
          },
          {
            "name": "Content",
            "dataType": "STRING",
            "singleValueField": true
          },
          {
            "name": "Sender",
            "dataType": "STRING",
            "singleValueField": true
          },
          {
            "name": "RoutingKey",
            "dataType": "STRING",
            "singleValueField": true
          }
        ],
        "metricFieldSpecs": [],
        "dateTimeFieldSpecs": [
          {
            "name": "Timestamp",
            "dataType": "TIMESTAMP",
            "format": "1:MILLISECONDS:EPOCH",
            "granularity": "1:MILLISECONDS"
          }
        ],
        "primaryKeyColumns": ["Id"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
