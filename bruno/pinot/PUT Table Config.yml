info:
  name: PUT Table Config
  type: http
  seq: 1

http:
  method: PUT
  url: http://localhost:9000/tables/:tablename
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: tablename
      value: messages-de-DE_REALTIME
      type: path
  body:
    type: json
    data: |-
      {
        "tableName": "messages-de-DE_REALTIME",
        "tableType": "REALTIME",
        "segmentsConfig": {
          "replication": "1",
          "retentionTimeUnit": "DAYS",
          "retentionTimeValue": "365",
          "replicasPerPartition": "1",
          "minimizeDataMovement": false,
          "timeColumnName": "Timestamp"
        },
        "tenants": {
          "broker": "DefaultTenant",
          "server": "DefaultTenant",
          "tagOverrideConfig": {}
        },
        "tableIndexConfig": {
          "nullHandlingEnabled": false,
          "bloomFilterColumns": [],
          "invertedIndexColumns": [],
          "noDictionaryColumns": [],
          "aggregateMetrics": false,
          "enableDefaultStarTree": false,
          "sortedColumn": [],
          "onHeapDictionaryColumns": [],
          "rangeIndexColumns": [],
          "varLengthDictionaryColumns": [],
          "streamConfigs": {
            "streamType": "kafka",
            "stream.kafka.topic.name": "messages-de-DE",
            "stream.kafka.broker.list": "kafka:9092",
            "stream.kafka.consumer.prop.auto.offset.reset": "smallest",
            "stream.kafka.consumer.factory.class.name": "org.apache.pinot.plugin.stream.kafka30.KafkaConsumerFactory",
            "stream.kafka.decoder.class.name": "org.apache.pinot.plugin.inputformat.json.JSONMessageDecoder",
            "realtime.segment.flush.threshold.rows": "0",
            "realtime.segment.flush.threshold.segment.rows": "0",
            "realtime.segment.flush.threshold.time": "24h",
            "realtime.segment.flush.threshold.segment.size": "100M"
          },
          "enableDynamicStarTreeCreation": false,
          "columnMajorSegmentBuilderEnabled": true,
          "skipSegmentPreprocess": false,
          "optimizeNoDictStatsCollection": false,
          "optimizeDictionary": false,
          "optimizeDictionaryForMetrics": false,
          "optimizeDictionaryType": false,
          "noDictionarySizeRatioThreshold": 0.85,
          "compressionStatsEnabled": false,
          "rangeIndexVersion": 2,
          "autoGeneratedInvertedIndex": false,
          "createInvertedIndexDuringSegmentGeneration": false,
          "loadMode": "MMAP"
        },
        "fieldConfigList": [
          {
            "name": "Content",
            "encodingType": "RAW",
            "indexTypes": ["TEXT"]
          }
        ],
        "metadata": {},
        "quota": {},
        "routing": {},
        "query": {},
        "ingestionConfig": {
          "retryOnSegmentBuildPrecheckFailure": false,
          "rowTimeValueCheck": false,
          "segmentTimeValueCheck": true,
          "ingestionExceptionLogRateLimitPerMin": 5,
          "maxConsecutiveRecordFetchFailuresAllowed": 0,
          "continueOnError": false
        },
        "isDimTable": false,
        "isMaterializedView": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
