info:
  name: Completions
  type: http

http:
  method: POST
  url: http:/localhost:5050/engines/v1/completions
  body:
    type: json
    data: |
      {
        "model": "mistral",
        "prompt": "Translate into Italian: Hello World. Output only the translation with no punctuation, no quotes, no explanation, no newlines. Translation=",
        "max_tokens": 20
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
